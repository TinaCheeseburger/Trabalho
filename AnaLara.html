      <center><h3>todas as pessoas • os mesmos direitos</h3></center>
      <main class="login-main">
  <div class="login-card">
    <section class="login-form-area login-area-entrar">
      <div class="login-header">
        <h2>Bem-vinda de volta!</h2>
        <p>Entre na sua conta para continuar.</p>
      </div>
      <form>
        <label for="email-login">E-mail</label>
        <input id="email-login" type="email" placeholder="Seu e-mail" />
        <label for="senha-login">Senha</label>
        <input id="senha-login" type="password" placeholder="Sua senha" />
        <button class="login-button" type="button">Entrar</button>
      </form>
      <div class="login-switch">
        <p>Ainda não tem uma conta?</p>
        <span class="link-button">Cadastre-se</span>
      </div>
    </section>

    <section class="login-decoration">
      <div class="login-decoration-content">
        <span class="decoration-star">✿</span>
        <h2>Olá, amiga!</h2>
        <p>Crie sua conta e venha conhecer o Essenza.</p>
        <div class="decoration-symbols">♡ &nbsp; ✿ &nbsp; ♡</div>
      </div>
    </section>
  </div>
</main>
