!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compartilhe sua ideia | Essenza</title>
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <center><h1>⤷essenZa</h1></center>
    <header>
        <nav>
            <a href="../index.html">Início</a>
            <a href="pagina2.2.html">Página 1</a>
            <a href="pagina2.3.html" class="active">Página 2</a>
            <a href="pagina2.4.html">Página 3</a>
        </nav>
    </header>

    <main class="login-main">
        <div class="login-card">
            <section class="login-form-area" style="width:100%; margin-bottom:0;">
                <div class="login-header">
                    <div class="login-icon" aria-hidden="true">♡</div>
                    <h2>Compartilhe sua ideia</h2>
                    <p>Queremos ouvir sua opinião! Conte o que você pensa sobre os Objetivos de Desenvolvimento Sustentável.</p>
                </div>
                <form>
                    <label for="nome">Seu nome</label>
                    <input id="nome" name="nome" type="text" placeholder="Como podemos te chamar?" autocomplete="name" required>

                    <label for="email">Seu e-mail</label>
                    <input id="email" name="email" type="email" placeholder="seuemail@exemplo.com" autocomplete="email" required>

                    <label for="ods">Sobre qual ODS você quer falar?</label>
                    <select id="ods" name="ods" required>
                        <option value="" disabled selected>Escolha uma ODS</option>
                        <option value="ods1">ODS 1 — Erradicação da pobreza</option>
                        <option value="ods2">ODS 2 — Fome zero e agricultura sustentável</option>
                        <option value="ods3">ODS 3 — Saúde e bem-estar</option>
                        <option value="ods4">ODS 4 — Educação de qualidade</option>
                        <option value="ods5">ODS 5 — Igualdade de gênero</option>
                        <option value="ods6">ODS 6 — Água potável e saneamento</option>
                        <option value="ods7">ODS 7 — Energia limpa e acessível</option>
                        <option value="ods8">ODS 8 — Trabalho decente e crescimento econômico</option>
                        <option value="ods9">ODS 9 — Indústria, inovação e infraestrutura</option>
                        <option value="ods10">ODS 10 — Redução das desigualdades</option>
                        <option value="ods11">ODS 11 — Cidades e comunidades sustentáveis</option>
                        <option value="ods12">ODS 12 — Consumo e produção responsáveis</option>
                        <option value="ods13">ODS 13 — Ação contra a mudança global do clima</option>
                        <option value="ods14">ODS 14 — Vida na água</option>
                        <option value="ods15">ODS 15 — Vida terrestre</option>
                        <option value="ods16">ODS 16 — Paz, justiça e instituições eficazes</option>
                        <option value="ods17">ODS 17 — Parcerias e meios de implementação</option>
                    </select>

                    <label for="descricao">Sua opinião ou ideia</label>
                    <textarea id="descricao" name="descricao" rows="5" placeholder="Escreva aqui sua ideia..." required style="width:100%; box-sizing:border-box; padding:14px; border:3px solid #242424; border-radius:12px; font:inherit; resize:vertical; margin-bottom:18px;"></textarea>

                    <label for="data">Data</label>
                    <input id="data" name="data" type="date" required>

                    <button class="login-button" type="button" onclick="alert('Obrigada por compartilhar sua ideia! (Demonstração)')">Enviar ideia</button>
                </form>
            </section>
        </div>
    </main>
</body>
</html>
