   <section class="form-section">
<h1>Cadastro do Cliente:</h1>
<form>
    <div class="form-group">
        <label for="text">Nome Completo:</label>
        <input type="text" name="text" placeholder="Digite seu nome" required>


    </div>
    <div class="form-group">
        <label for="text">CPF:</label>
        <input type="number" name="number" placeholder="000.000.000-00" required>


    </div>
    <div class="form-group">
        <label for="text">RG:</label>
        <input type="number" name="number" placeholder="00.000.000-0" required>


    </div>


    <div class="form-group">
        <label for="text">Endereço:</label>
        <input type="text" name="text" placeholder="Digite seu endereço" required>


    </div>
    
    <div class="form-group">
    <label for="select">Estado civil:</label>
        <select id="select" name="select">
    <option value="Solteiro(a)">Solteiro(a)</option>
    <option value="Casado(a)">Casado(a)</option>
    <option value="Viuvô(a)">Viuvô(a)</option>
    <option value="Divorciado(a)">Divorciado(a)</option>
    </select>
    </div>
    
    <div class="form-group">
        <label for="date">Data de nascimento</label>
        <input type="date" name="date" placeholder="Digite a data de nascimento" required>

    </div>
 

<div class="form-group">
    <label for="select">Sexo</label>
        <select id="select" name="select">
<option value="feminino">feminino</option>
<option value="masculino">masculino</option>
</select>
</div>


    <div class="form-group">
        <label for="text">Nacionalidade:</label>
        <input type="text" name="text" placeholder="Digite sua Nacionalidade:" required>


    </div>

    <h3>CONTATO</h3>
<div class="form-group">
        <label for="tel">Telefone</label>
        <input type="tel" name="tel" placeholder="00 00000-0000">
</div>
<div class="form-group">
        <label for="tel">Whatsapp</label>
        <input type="tel" name="tel" placeholder="00 00000-0000">
</div>
<div class="form-group">
        <label for="text">Email:</label>
        <input type="text" name="text" placeholder="Digite seu Email">



    </div>
    <h3>ENDEREÇO</h3>
    <div class="form-group">
        <label for="text">CEP:</label>
        <input type="text" name="text" placeholder="0000-000" required>


    </div>
    <div class="form-group">
        <label for="text">Rua/avenida:</label>
        <input type="text" name="text" placeholder="Digite sua rua/avenida" required>


    </div>
    <div class="form-group">
        <label for="text">Número:</label>
        <input type="text" name="text" placeholder="Digite o número" required>


    </div> 
    <div class="form-group">
        <label for="text">Complemento:</label>
        <input type="text" name="text" placeholder="Digite o Complemento(opcional)">


    </div>

    <div class="form-group">
        <label for="text">Bairro:</label>
        <input type="text" name="text" placeholder="Digite o bairro" required>


    </div>
    <div class="form-group">
        <label for="text">Cidade:</label>
        <input type="text" name="text" placeholder="Digite a cidade" required>


    </div>
